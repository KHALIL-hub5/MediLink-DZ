<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md text-on-background relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] start-[-10%] w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] z-0"></div>
<div class="absolute bottom-[-10%] end-[-10%] w-96 h-96 bg-secondary-container/20 rounded-full blur-[100px] z-0"></div>
<main class="w-full max-w-md relative z-10">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary mb-sm">MediLink DZ</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome back. Please sign in to your account.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-md md:p-lg">
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center bg-surface-container-lowest border border-outline-variant rounded-lg input-glow transition-all duration-200">
<span aria-hidden="true" class="material-symbols-outlined absolute start-sm text-on-surface-variant">person</span>
<input class="w-full bg-transparent border-none py-sm pe-sm ps-[48px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 rounded-lg" id="email" name="email" placeholder="doctor@medilink.dz" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center bg-surface-container-lowest border border-outline-variant rounded-lg input-glow transition-all duration-200">
<span aria-hidden="true" class="material-symbols-outlined absolute start-sm text-on-surface-variant">lock</span>
<input class="w-full bg-transparent border-none py-sm pe-sm ps-[48px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 rounded-lg" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md py-sm rounded-lg shadow-sm active:scale-95 transition-all duration-150 flex items-center justify-center gap-xs" type="submit">
                    Sign In
                    <span aria-hidden="true" class="material-symbols-outlined">login</span>
</button>
<!-- Divider -->
<div class="relative py-sm flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-sm font-label-md text-label-md text-on-surface-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs py-xs px-sm border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors font-label-md text-label-md text-on-surface" type="button">
<!-- Simplified Google Icon (SVG) -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
