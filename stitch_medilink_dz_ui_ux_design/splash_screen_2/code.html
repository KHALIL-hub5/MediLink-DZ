<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                      "error": "#ba1a1a",
                      "on-error": "#ffffff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-surface": "#0b1c30",
                      "surface-container-highest": "#d3e4fe",
                      "on-tertiary-fixed": "#40000d",
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#213145",
                      "secondary-fixed-dim": "#89ceff",
                      "surface": "#f8f9ff",

                      "on-background": "#0b1c30",

<style>
        .medical-pattern {
            background-image: 
                radial-gradient(circle at 100% 150%, rgba(255, 255, 255, 0.03) 24%, rgba(255, 255, 255, 0) 25%),
                radial-gradient(circle at 0% 150%, rgba(255, 255, 255, 0.03) 24%, rgba(255, 255, 255, 0) 25%),
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.05) 10%, rgba(255, 255, 255, 0) 11%);
            background-size: 60px 60px;
        }
        
        .pulse-logo {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        @keyframes pulse-soft {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.02);
                opacity: 0.9;
            }
        }

        .shimmer-loader {
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        .shimmer-loader::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.4) 20%,
                rgba(255, 255, 255, 0.6) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary m-0 p-0 h-screen w-screen overflow-hidden flex flex-col justify-between items-center medical-pattern">
<!-- Top Spacer for balance -->
<div class="h-24 w-full"></div>
<!-- Center Content: Logo -->
<div class="flex flex-col items-center justify-center pulse-logo flex-grow">
<div class="bg-white/10 p-6 rounded-full backdrop-blur-sm border border-white/20 mb-6 shadow-xl">
<span class="material-symbols-outlined text-[64px] text-white" style="font-variation-settings: 'FILL' 1;">
                health_and_safety
            </span>
</div>
<h1 class="font-display-lg text-display-lg text-white mb-2 tracking-tight text-center px-4">
            MediLink DZ
        </h1>
<p class="font-body-lg text-body-lg text-primary-fixed-dim text-center px-4 max-w-sm">
            Professional Healthcare Network
        </p>
</div>
<!-- Bottom Content: Loader and Language -->
<div class="w-full flex flex-col items-center pb-margin-desktop px-margin-mobile">
<!-- Loader -->
<div class="w-48 h-1 shimmer-loader mb-8 shadow-[0_0_10px_rgba(255,255,255,0.3)]"></div>
<!-- Language Toggle -->
<div class="flex items-center gap-4 bg-black/10 backdrop-blur-md rounded-full px-4 py-2 border border-white/10">
<button class="font-label-md text-label-md text-white font-bold opacity-100 transition-opacity hover:opacity-100">
                EN
            </button>
<div class="w-px h-3 bg-white/30"></div>
<button class="font-label-md text-label-md text-white/60 transition-opacity hover:opacity-100">
                FR
            </button>
<div class="w-px h-3 bg-white/30"></div>
<button class="font-label-md text-label-md text-white/60 transition-opacity hover:opacity-100">
                AR
            </button>
</div>
</div>
</body></html>
