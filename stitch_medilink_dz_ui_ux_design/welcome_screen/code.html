<!-- Main Content Canvas -->

<!-- Decorative Ambient Background -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container/30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
</div>
<div class="w-full max-w-md mx-auto z-10 flex flex-col items-center">
<!-- Illustration Area -->
<div class="w-full aspect-square max-w-[320px] mb-lg relative">
<div class="absolute inset-0 bg-surface-container-highest rounded-full shadow-[0_12px_32px_rgba(0,0,0,0.08)] backdrop-blur-[16px] border border-white/30 overflow-hidden flex items-center justify-center">

</div>

<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div class="absolute bottom-12 -right-4 bg-primary-container text-on-primary-container rounded-full p-3 shadow-lg border border-primary-container flex items-center justify-center animate-bounce" style="animation-duration: 4s; animation-delay: 0.5s;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<!-- Typography Header -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-background mb-sm">
                    Your Digital <br class="hidden md:block"/>Healthcare Assistant
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] md:max-w-md mx-auto">
                    Connecting you with the best doctors and pharmacies across Algeria.
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-sm">
<!-- Login Button -->
<button class="w-full bg-surface border border-outline-variant text-primary font-label-md text-label-md py-4 rounded-xl shadow-sm hover:bg-surface-container-low transition-colors duration-200 active:scale-95 flex items-center justify-center gap-2 group">
<span>Login</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-[0_4px_20px_rgba(0,106,59,0.2)] hover:bg-surface-tint hover:shadow-[0_12px_32px_rgba(0,106,59,0.3)] transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">person_add</span>

</button>

<button class="w-full bg-transparent text-on-surface-variant font-label-md text-label-md py-4 rounded-xl hover:bg-surface-container-highest transition-colors duration-200 active:scale-95 mt-xs">
